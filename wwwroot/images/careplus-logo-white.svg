    <!-- Cross -->
    <rect x="25" y="12" width="14" height="40" rx="2" fill="#ffffff"/>
    <rect x="12" y="25" width="40" height="14" rx="2" fill="#ffffff"/>
    <!-- Leaf -->
    <path d="M 36 36 C 36 31 43 30 46 30 C 46 38 41 45 36 45 C 36 41 36 38 36 36 Z" fill="#6ee7b7"/>
